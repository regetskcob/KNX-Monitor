configuration:
  read_only:
    name: Nur lesen
    description: >-
      Der Server sendet nichts auf den Bus, auch keine Leseanfragen.
      Aufzeichnung, Auswertung und Gesundheitsprüfung laufen weiter.
      Ausschalten, wenn du aus dem Add-on Werte schreiben oder abfragen
      willst.
  alarm_notifications:
    name: Mitteilungen bei Alarmen
    description: >-
      Benachrichtigung, wenn ein Alarm- oder Störungsobjekt auslöst.
      Ausschalten, wenn du stattdessen mit dem Ereignis knx_monitor_alarm
      eigene Automationen nutzt.
  watcher_notifications:
    name: Mitteilungen bei Wächtern
    description: >-
      Benachrichtigung, wenn ein Wächter anschlägt. Ausschalten, wenn du
      stattdessen mit dem Ereignis knx_monitor_watcher eigene Automationen
      nutzt.
  notify_service:
    name: Benachrichtigungsdienst
    description: >-
      Optional: Dienst für Alarm-Mitteilungen, z. B. „notify.mobile_app_iphone“.
      Leer lassen für eine Benachrichtigung in Home Assistant.
  dashboard_card:
    name: Dashboard-Karte
    description: >-
      Legt die Karte „Busclear Diagramm“ nach /config/www/knx-monitor/
      und meldet sie als Dashboard-Ressource an. Sie zeigt die in der App
      gespeicherten Diagramme. Ausschalten, wenn du die Karte nicht
      brauchst oder Ressourcen selbst pflegst.
  mqtt_telegrams:
    name: Jedes Telegramm an MQTT
    description: >-
      Test: schickt jedes Telegramm als JSON an knx_monitor/telegram/1/2/3,
      mit Zeitstempel, Name, DPT und Wert aus dem ETS-Projekt. Jeder, der
      den Broker lesen kann, sieht Adressen, Namen und Werte deiner Anlage.
      Braucht einen MQTT-Broker (Mosquitto).
  mqtt_secure_telegrams:
    name: Auch KNX-Secure-Telegramme an MQTT
    description: >-
      Nur zusammen mit „Jedes Telegramm an MQTT“. Schickt auch mit KNX Data
      Secure geschützte Telegramme, entschlüsselt und als Klartext. Jeder,
      der den Broker lesen kann, sieht dann genau die Werte, die die
      Verschlüsselung schützen soll. Standard aus.
  mqtt_raw:
    name: Rohdaten mitsenden
    description: >-
      Nur zusammen mit „Jedes Telegramm an MQTT“. Fügt den vollständigen
      cEMI-Rahmen als Hex, Art des Rahmens, Priorität, Bestätigungswunsch
      und eine Prüfsumme (key) zum Erkennen doppelter Telegramme hinzu.
      Standard aus.
  mqtt_raw_only:
    name: Nur Rohdaten
    description: >-
      Wie „Rohdaten mitsenden“, aber ohne Name, Gerätename, DPT, Wert und
      Einheit aus dem ETS-Projekt, für Datenbanken, die die Werte selbst
      auswerten. Standard aus.
  mqtt_retain_values:
    name: Letzten Wert je Adresse behalten
    description: >-
      Nur zusammen mit „Jedes Telegramm an MQTT“. Schickt zusätzlich jeden
      neuen Wert an knx_monitor/value/<Adresse>, mit retain: Wer sich
      später anmeldet, bekommt sofort den letzten Stand. Nur wenn sich der
      Wert ändert. Standard aus.
  mqtt_filter:
    name: Nur diese Gruppenadressen an MQTT
    description: >-
      Leer: alle. Sonst dreistufige Adressen oder Bereiche, durch Komma
      getrennt, z. B. 1/#,3/2/#,4/1/7. Andere Telegramme gehen nicht an
      den Broker.
  mqtt_installation:
    name: Kennung der Anlage (inst)
    description: >-
      Steht in jeder MQTT-Nachricht als inst und hält mehrere Server in
      einer Datenbank auseinander. Leer: die Kennung der aktiven Anlage.
