configuration:
  read_only:
    name: Read only
    description: >-
      The server sends nothing to the bus, not even read requests.
      Recording, evaluations and the health check keep running. Turn off
      if you want to write or request values from the add-on.
  alarm_notifications:
    name: Alarm notifications
    description: >-
      Notify when an alarm or fault object triggers. Turn off if you use your
      own automations with the knx_monitor_alarm event instead.
  watcher_notifications:
    name: Watcher notifications
    description: >-
      Notify when a watcher fires. Turn off if you use your own automations
      with the knx_monitor_watcher event instead.
  notify_service:
    name: Notification service
    description: >-
      Optional: service for alarm notifications, e.g.
      "notify.mobile_app_iphone".
      Leave empty for a Home Assistant notification.
  dashboard_card:
    name: Dashboard card
    description: >-
      Puts the “Busclear chart” card into /config/www/knx-monitor/ and
      registers it as a dashboard resource. It shows the charts saved in
      the app. Turn off if you do not need the card or manage resources
      yourself.
  mqtt_telegrams:
    name: Every telegram to MQTT
    description: >-
      Preview: sends every telegram as JSON to knx_monitor/telegram/1/2/3,
      with timestamp, name, DPT and value from the ETS project. Anyone who
      can read the broker sees addresses, names and values of your
      installation. Needs an MQTT broker (Mosquitto).
  mqtt_secure_telegrams:
    name: KNX Secure telegrams to MQTT too
    description: >-
      Only together with "Every telegram to MQTT". Also sends telegrams
      protected by KNX Data Secure, decrypted, in plain text. Anyone who can
      read the broker then sees exactly the values the encryption is meant
      to protect. Off by default.
  mqtt_raw:
    name: Send raw data too
    description: >-
      Only together with "Every telegram to MQTT". Adds the complete cEMI
      frame as hex, the frame kind, priority, acknowledge request and a
      checksum (key) to spot duplicate telegrams. Off by default.
  mqtt_raw_only:
    name: Raw data only
    description: >-
      Like "Send raw data too", but without name, device name, DPT, value
      and unit from the ETS project, for databases that decode the values
      themselves. Off by default.
  mqtt_retain_values:
    name: Keep last value per address
    description: >-
      Only together with "Every telegram to MQTT". Also sends every new value
      to knx_monitor/value/<address>, retained: whoever subscribes later gets
      the latest state at once. Only when the value changes. Off by default.
  mqtt_filter:
    name: Only these group addresses to MQTT
    description: >-
      Empty: all. Otherwise three-level addresses or ranges separated by
      commas, e.g. 1/#,3/2/#,4/1/7. Other telegrams stay off the broker.
  mqtt_installation:
    name: Installation ID (inst)
    description: >-
      Sent as inst in every MQTT message to tell several servers apart in
      one database. Empty: the ID of the active installation.
