name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case or problem
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Home Assistant add-on
        - Linux
        - iOS / iPadOS
        - Android
        - macOS
        - Windows
        - KNX Box
